<aside class="sidebar">
  <div class="brand-section">
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="brand-link"
    >
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="3.5" y="4.5" width="12" height="9" rx="2"></rect>
          <path d="M8 18.5h8.5a2 2 0 0 0 2-2v-4"></path>
          <path d="M10 13.5v5"></path>
          <path d="M7 18.5h6"></path>
        </svg>
      </div>

      <div class="brand-text">AssetHub</div>
    </a>
  </div>

  <nav class="menu">
    @for (item of menuItems; track item.label) {
      <div class="menu-group">
        @if (item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="menu-item"
          >
            <span class="menu-icon" [attr.data-icon]="item.icon"></span>
            <span class="menu-label">{{ item.label }}</span>
          </a>
        } @else {
          <div class="menu-item static-item">
            <span class="menu-icon" [attr.data-icon]="item.icon"></span>
            <span class="menu-label">{{ item.label }}</span>
          </div>
        }

        @if (item.children?.length) {
          <div class="submenu">
            @for (child of item.children; track child.label) {
              <a
                [routerLink]="child.route"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                class="menu-item child-item"
              >
                <span class="menu-icon" [attr.data-icon]="child.icon"></span>
                <span class="menu-label">{{ child.label }}</span>
              </a>
            }
          </div>
        }
      </div>
    }
  </nav>
<div class="sidebar-footer">
  <a
    routerLink="/profile"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
    class="user-block"
  >
    <div class="avatar">{{ initials }}</div>

    <div class="user-details">
      <div class="name">{{ fullName }}</div>
      <div class="email">{{ subtitle }}</div>
    </div>

    <div class="logout-icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M10 17l5-5-5-5"></path>
        <path d="M15 12H4"></path>
        <path d="M20 4v16"></path>
      </svg>
    </div>
  </a>
</div>
</aside>
