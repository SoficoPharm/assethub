<section class="form-page">
  <div class="page-header">
    <div class="breadcrumb">Employees <span>›</span> Add</div>
    <h1>Add New Employee</h1>
  </div>

  <div class="card-wrap">
    <div class="section-title-row">
      <button class="back-btn" type="button" [disabled]="saving" (click)="backToList()">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>

      <h2>Employee Details</h2>
    </div>

    <div class="card">
      <div class="grid two-cols">
        <div class="form-group">
          <label>Full Name <span>*</span></label>
          <input
            type="text"
            [(ngModel)]="fullName"
            name="fullName"
            [disabled]="saving"
            placeholder="e.g. Jane Doe"
          />
        </div>

        <div class="form-group">
          <label>Email Address <span>*</span></label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            [disabled]="saving"
            placeholder="jane.doe@assethub.local"
          />
        </div>

        <div class="form-group">
          <label>Employee ID</label>
          <input
            type="text"
            [(ngModel)]="employeeId"
            name="employeeId"
            [disabled]="saving"
            placeholder="e.g. EMP-123"
          />
        </div>
        <div class="form-group">
  <label>User Domain</label>
  <input
    type="text"
    [(ngModel)]="userDomain"
    name="userDomain"
    [disabled]="saving"
    placeholder="e.g. SOFICOPHARM\username"
  />
</div>

        <div class="form-group">
          <label>Department</label>

          <div class="select-add-row">
            <select [(ngModel)]="department" name="department" [disabled]="saving">
              <option value="">Select department</option>
              @for (item of departments; track item) {
                <option [value]="item">{{ item }}</option>
              }
            </select>

            <button
              type="button"
              class="add-mini-btn"
              [disabled]="saving"
              (click)="toggleAddDepartment()"
            >
              + Add
            </button>
          </div>

          @if (showAddDepartment) {
            <div class="inline-add-box">
              <input
                type="text"
                [(ngModel)]="newDepartment"
                name="newDepartment"
                placeholder="e.g. Operations"
              />

              <div class="inline-add-actions">
                <button type="button" class="save-mini-btn" [disabled]="addingDepartment" (click)="addDepartment()">Add</button>
                <button type="button" class="cancel-mini-btn" (click)="closeAllAddBoxes()">Cancel</button>
              </div>
            </div>
          }
        </div>

        <div class="form-group">
          <label>Job Title</label>
          <input
            type="text"
            [(ngModel)]="jobTitle"
            name="jobTitle"
            [disabled]="saving"
            placeholder="e.g. Senior Developer"
          />
        </div>
      </div>

      <div class="images-section">
        <div class="section-label">Employee Image</div>

        <label class="upload-box" [class.disabled]="saving">
          <input
            type="file"
            accept="image/*"
            [disabled]="saving"
            (change)="onImageSelected($event)"
          />

          <div class="upload-icon">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 16V4"></path>
              <path d="M7 9l5-5 5 5"></path>
              <path d="M5 20h14"></path>
            </svg>
          </div>

          <div>
            <div class="upload-title">Upload employee image</div>
            <div class="upload-subtitle">
              Upload employee profile image, ID image, or custody paper image
            </div>
          </div>
        </label>

        @if (imagePreview) {
          <div class="images-list">
            <div class="image-item">
              <img [src]="imagePreview" alt="Employee preview" class="real-preview" />

              <div class="image-info">
                <div class="image-name">{{ imageName }}</div>
                <div class="image-meta">Employee Image • {{ imageSize }}</div>
              </div>

              <button
                type="button"
                class="remove-image-btn"
                [disabled]="saving"
                (click)="removeImage()"
              >
                Remove
              </button>
            </div>
          </div>
        }
      </div>

      <div class="actions">
        <button class="secondary-btn" type="button" [disabled]="saving" (click)="cancel()">
          Cancel
        </button>

        <button class="primary-btn" type="button" [disabled]="saving" (click)="saveEmployee()">
          Save Employee
        </button>
      </div>

    </div>
  </div>

  @if (saving) {
    <div class="page-loader">
      <div class="spinner"></div>
      <span>Saving employee...</span>
    </div>
  }
</section>
