<section class="unauthorized-page">
  <div class="unauthorized-card">
    <div class="icon-wrap">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 3l7 3v5c0 4.5-2.7 7.8-7 10-4.3-2.2-7-5.5-7-10V6l7-3Z"></path>
          <path d="M12 8v4"></path>
          <circle cx="12" cy="15.5" r="0.8" fill="currentColor" stroke="none"></circle>
        </svg>
      </div>
    </div>

    <h1>Access Denied</h1>
    <p>
      You don't have the required permissions to view this
      page or perform this action.
    </p>

    <div class="actions">
      <button class="go-back-btn" type="button" (click)="goBack()">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M19 12H5"></path>
          <path d="M11 6l-6 6 6 6"></path>
        </svg>
        Go Back
      </button>

      <button class="sign-out-btn" type="button" (click)="signOut()">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M10 17l5-5-5-5"></path>
          <path d="M15 12H4"></path>
          <path d="M20 4v16"></path>
        </svg>
        Sign Out
      </button>
    </div>

    <div class="help-note">
      If you believe this is an error, please contact your system administrator.
    </div>
  </div>
</section>
